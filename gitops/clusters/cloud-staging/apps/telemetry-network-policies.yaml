apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-network-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/acumino-ai/acumino-sandbox.git
    targetRevision: main
    path: gitops/manifests/telemetry/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
