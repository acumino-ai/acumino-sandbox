apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry-signer.fullname" . }}
  labels:
    {{- include "telemetry-signer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "telemetry-signer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "telemetry-signer.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: signer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SIGNER_BUCKET
              value: {{ .Values.config.bucket | quote }}
            - name: SIGNER_REGION
              value: {{ .Values.config.region | quote }}
            - name: SIGNER_URL_TTL_SECONDS
              value: {{ .Values.config.urlTtlSeconds | quote }}
            - name: SIGNER_JWKS_URL
              value: {{ .Values.config.jwksUrl | quote }}
            - name: SIGNER_AUDIENCE
              value: {{ .Values.config.audience | quote }}
            - name: SIGNER_ALLOWED_DATASETS
              value: {{ .Values.config.allowedDatasets | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
