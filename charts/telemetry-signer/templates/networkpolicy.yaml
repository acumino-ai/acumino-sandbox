{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "telemetry-signer.fullname" . }}
  labels:
    {{- include "telemetry-signer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "telemetry-signer.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
{{- end }}
