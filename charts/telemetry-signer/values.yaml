replicaCount: 2

image:
  repository: 476918794945.dkr.ecr.us-east-1.amazonaws.com/telemetry-signer
  tag: latest
  pullPolicy: Always

serviceAccount:
  create: true
  name: telemetry-signer
  # IRSA role used to sign S3 URLs
  roleArn: ""

config:
  bucket: ""
  region: us-east-1
  urlTtlSeconds: 604800
  jwksUrl: ""
  audience: api://telemetry-signer
  allowedDatasets: telemetry,diagnostics,video

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: alb
  host: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

rbac:
  # Lets the signer watch its own config for hot-reload.
  create: true

networkPolicy:
  enabled: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
